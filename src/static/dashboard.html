<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watchtower</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --border: rgba(255, 255, 255, 0.10);
      --series: #3987e5;
      --good: #0ca30c;
      --warning: #fab219;
      --critical: #d03b3b;
    }

    body {
      background-color: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    #heartbeat[data-state="stalled"] {
      color: var(--critical);
    }

    #heartbeat[data-state="none"] {
      color: var(--muted);
    }

    #heartbeat[data-state="delayed"] {
      color: var(--warning);
    }

    #heartbeat[data-state="live"] {
      color: var(--good);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px
    }

    .card h2 {
      margin: 0 0 12px;
    }

    .lists {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .lists .card {
      margin-bottom: 0;
    }

    .lists {
      margin-bottom: 12px;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .lists li {
      display: grid;
      grid-template-columns: 40% 1fr;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .track {
      display: flex;
      align-items: center;
    }

    .bar {
      height: 18px;
      background: var(--series);
      border-radius: 0 4px 4px 0;
      min-width: 2px;
    }

    .bar-value {
      margin-left: 8px;
      font-size: 14px;
      color: var(--ink);
    }

    .bar-label {
      color: var(--ink-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chart-wrap {
      position: relative;
      height: 260px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      color: var(--muted);
      font-weight: 500;
      padding: 6px 8px;
    }

    td {
      padding: 6px 8px;
      border-top: 1px solid var(--border);
      color: var(--ink-2);
    }

    td[data-rule="persistent_scanner"] {
      color: var(--warning);
    }

    td[data-rule="auth_limit_hit"] {
      color: var(--critical);
    }

    #rules-card {
      grid-column: 1 / -1;
    }

    #rules-card li {
      grid-template-columns: 12rem 1fr;
      margin-bottom: 0;
    }
  </style>
</head>

<body>
  <h1>Watchtower</h1>
  <form id="login-form">
    <input id="key-input" type="password" placeholder="API key">
    <button type="submit">Open</button>
  </form>
  <div class="dashboard-header">
    <h3>Total Events: <span id="event-count">-</span></h3>
    <h3>Total alerts: <span id="alert-count">-</span></h3>
    <h3>Unique ips: <span id="ip-count">-</span></h3>
  </div>


  <p id="msg">waiting…</p>


  <div class="lists">
    <section class="card">
      <h2>Top Ips</h2>
      <ul id="ip-list"></ul>
    </section>
    <section class="card">
      <h2>Event Types</h2>
      <ul id="event-list"></ul>
    </section>
    <section class="card">
      <h2>Top Usernames</h2>
      <ul id="username-list"></ul>
    </section>
    <section class="card" id="rules-card">
      <h2>Alerts By Rule (24hr)</h2>
      <ul id="rule-list">

      </ul>
    </section>

  </div>

  <section class="card">
    <h2>Events per hour (last 24h)</h2>
    <div class="chart-wrap">
      <canvas id="timeline-chart"></canvas>
    </div>
  </section>
  <p id="heartbeat">...</p>

  <section class="card">
    <h2>Recent Alerts</h2>
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Rule</th>
          <th>IP</th>
          <th>Count</th>
        </tr>
      </thead>
      <tbody id="alerts-body"></tbody>
    </table>
  </section>



  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"
    integrity="sha384-zYPBGXwO4633CABX/5Spf6emCKUJCfoOkhOMYyxMsatqQZPnDblmmOewfjsIVWCM" crossorigin="anonymous">
    </script>

  <script>
    "use strict";

    const nf = new Intl.NumberFormat();
    let timelineChart = null;   // holds the Chart instance between refreshes
    let timelinePoints = [];

    function parseDbTime(s) {
      return new Date(s.replace(" ", "T") + "Z");
    }


    function renderTimeline(points) {
      timelinePoints = points;
      // 1. turn the 25 {hour, count} objects into two parallel arrays
      //    labels: "10 AM", "11 AM"... in YOUR local time (hour is UTC ISO, e.g. "2026-10-12T17:00:00Z")
      const labels = points.map(p =>
        new Date(p.hour).toLocaleTimeString([], { hour: "numeric" })
      );
      //    data: just the numbers
      const data = points.map(p => p.count);

      // 2. second and later refreshes: the chart already exists, so swap the data
      //    in place and redraw. Don't create a new chart on the same canvas.
      if (timelineChart) {
        timelineChart.data.labels = labels;
        timelineChart.data.datasets[0].data = data;
        timelineChart.update();
        return;
      }

      // 3. first run: create the chart
      const canvas = document.getElementById("timeline-chart");
      timelineChart = new Chart(canvas, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            data: data,
            borderColor: "#3987e5",  // (canvas can't read CSS vars directly)
            borderWidth: 2,
            pointRadius: 0,           // no dots; the line is the point
            tension: 0.2,
            backgroundColor: "rgba(57, 135, 229, 0.15)",   //  --series blue at 15% opacity
            fill: true

          }]
        },
        options: {
          maintainAspectRatio: false,   // fill the 260px .chart-wrap instead of keeping a fixed ratio
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                // title = the top line of the tooltip. Default is just "11 AM".
                // items[0].dataIndex is which point you're hovering (0..24)
                title: (items) => {
                  const iso = timelinePoints[items[0].dataIndex].hour;
                  return new Date(iso).toLocaleString([], { weekday: "short", hour: "numeric" });
                },
                // label = the line with the number. ctx.parsed.y is the count.
                label: (ctx) => {
                  const isLast = ctx.dataIndex === ctx.dataset.data.length - 1;
                  return nf.format(ctx.parsed.y) + " events" + (isLast ? " (so far)" : "");
                }
              }
            }
          },
          scales: {
            x: { ticks: { color: "#c3c2b7", maxTicksLimit: 8 }, grid: { color: "rgba(255,255,255,0.08)" } },
            y: { beginAtZero: true, ticks: { color: "#c3c2b7" }, grid: { color: "rgba(255,255,255,0.08)" } }
          }
        }
      });
    }

    async function load() {
      const key = localStorage.getItem("watchtower_key");
      if (!key) {
        document.getElementById("msg").textContent = "no key saved";
        return;
      }

      try {
        const res = await fetch("/stats?hours=24", { headers: { "X-API-Key": key } });
        if (res.ok) {
          const s = await res.json();
          renderTimeline(s.timeline);

          renderList(document.getElementById("ip-list"), s.top_ips);
          renderList(document.getElementById("username-list"), s.top_usernames);
          renderList(document.getElementById("event-list"), s.event_types);
          renderList(document.getElementById("rule-list"), s.alerts_by_rule);

          renderHeartbeat(getHeartbeat(s.last_event_at));


          document.getElementById("msg").textContent = "";
          if (s.totals) {
            document.getElementById("event-count").textContent = nf.format(s.totals.events);
            document.getElementById("alert-count").textContent = nf.format(s.totals.alerts);
            document.getElementById("ip-count").textContent = nf.format(s.totals.unique_ips);
          }

        } else if (res.status === 401) {
          localStorage.removeItem("watchtower_key");
          document.getElementById("msg").textContent = "That key was rejected";
        } else {
          document.getElementById("msg").textContent = "Server error (" + res.status + ").";
        }

      } catch (error) {
        document.getElementById("msg").textContent = "Error loading data: " + error.message;
      }
      try {
        const res = await fetch("/alerts?limit=15", { headers: { "X-API-Key": key } })
        if (res.ok) {
          const s = await res.json();
          renderAlerts(s);
        }

      } catch (error) {
        document.getElementById("msg").textContent = "Error loading data: " + error.message;
      }
    }


    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      localStorage.setItem("watchtower_key", document.getElementById("key-input").value.trim());
      load();

    });

    function renderAlerts(rows) {
      const body = document.getElementById("alerts-body");
      body.replaceChildren();                       // no duplicates on refresh


      if (rows.length === 0) {
        const newRow = document.createElement("tr");
        const cell1 = document.createElement("td");
        cell1.colSpan = 4;
        cell1.textContent = "No Alerts yet"
        newRow.append(cell1)
        body.append(newRow)
        return;
      }

      for (const a of rows) {
        const tr = document.createElement("tr");
        const cell1 = document.createElement("td");
        const cell2 = document.createElement("td");
        const cell3 = document.createElement("td");
        const cell4 = document.createElement("td");

        cell1.textContent = parseDbTime(a.triggered_at).toLocaleString();
        cell2.textContent = a.rule_name;
        cell2.dataset.rule = a.rule_name;   // becomes data-rule="persistent_scanner" in the HTML

        cell3.textContent = a.matched_entity ?? "-";
        cell4.textContent = nf.format(a.count);

        tr.append(cell1, cell2, cell3, cell4);
        body.append(tr);

      }
    }

    function renderList(container, rows) {
      // 1. empty the container, so refreshes don't pile up duplicates
      container.replaceChildren();
      // 2. if rows is empty, show 
      if (rows.length === 0) {
        const emptyLi = document.createElement("li");
        emptyLi.textContent = "No rows returned";
        container.append(emptyLi);
        return;
      }
      const max = Math.max(...rows.map(r => r.count));
      for (const row of rows) {
        //create bar
        const newBar = document.createElement("span")
        newBar.style.width = (row.count / max) * 80 + "%"
        newBar.className = "bar";
        //create label
        const newLabel = document.createElement("span")
        newLabel.textContent = row.label
        newLabel.className = "bar-label";
        //create count
        const newCount = document.createElement("span");
        newCount.textContent = nf.format(row.count);
        newCount.className = "bar-value";

        const li = document.createElement("li");
        li.title = row.label + ": " + nf.format(row.count);

        const track = document.createElement("span");
        track.className = "track";

        track.append(newBar, newCount);   // bar and number go in the wrapper
        li.append(newLabel, track);       // label and wrapper go in the row
        container.append(li);             // the row goes in the list

      }

    }

    function getHeartbeat(lastEventAt) {
      if (lastEventAt) {
        const ageMinutes = (Date.now() - new Date(lastEventAt).getTime()) / 60000;
        if (ageMinutes < 15) {
          return "live";
        } else if (ageMinutes < 60) {
          return "delayed";
        } else {
          return "stalled";
        }
      } else {
        return "none";
      }
    }
    function renderHeartbeat(state) {
      const LABELS = {
        live: "Live",
        delayed: "Delayed",
        stalled: "Down",
        none: "No data"
      }
      const el = document.getElementById("heartbeat");
      el.dataset.state = state;          //state key for css
      el.textContent = LABELS[state];    // the display text
    }


    load();
    setInterval(load, 30000);
  </script>
</body>

</html>
